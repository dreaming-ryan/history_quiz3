<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B83A3A'/><text x='50' y='68' text-anchor='middle' font-size='52' font-family='serif' font-weight='700' fill='%23fff'>韓</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사능력검정시험 심화 — 단원별 기출문제</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF7F2;--surface:#FFFFFF;--border:#E5DFD3;
  --text-main:#1F1A14;--text-sub:#5A5046;--text-muted:#9A8E7C;
  --point:#B83A3A;--point-l:#FBE9E9;
  /* 7개 단원 색 (history_quiz.html과 동일) */
  --sub1:#5C7A3B;--sub1-l:#EBF1E1;
  --sub2:#1F5C8C;--sub2-l:#E2EDF6;
  --sub3:#8C4A1F;--sub3-l:#F4E6DA;
  --sub4:#5A3D8C;--sub4-l:#EAE0F4;
  --sub5:#9C6B1F;--sub5-l:#F6EBD4;
  --sub6:#3F3F3F;--sub6-l:#E5E5E5;
  --sub7:#2E6B6B;--sub7-l:#DDF0EE;
  --r-lg:20px;--r-md:14px;
  --sh-sm:0 1px 4px rgba(28,26,22,.06);--sh-lg:0 12px 40px rgba(28,26,22,.12)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.site-header{width:100%;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;background:var(--point);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-family:'Noto Serif KR',serif;font-weight:700}
.logo-text{font-size:15px;font-weight:600;color:var(--text-main);letter-spacing:-.02em}
.logo-text span{color:var(--point)}
.back-btn{font-size:13px;color:var(--text-sub);text-decoration:none;padding:6px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--border);transition:all .15s}
.back-btn:hover{background:var(--point-l);color:var(--point);border-color:var(--point-l)}
.main{width:100%;max-width:680px;padding:2.5rem 1.5rem 6rem;flex:1}
.page-title{text-align:center;margin-bottom:2rem;animation:fadeUp .5s ease both}
.page-title h1{font-size:clamp(22px,4vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.4;margin-bottom:.6rem}
.page-title h1 em{color:var(--point);font-style:normal}
.page-title p{font-size:14px;color:var(--text-sub);line-height:1.65}
.subject-grid{display:grid;grid-template-columns:1fr;gap:12px;animation:fadeUp .6s .1s ease both}
.subject-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.4rem 1.6rem;text-decoration:none;display:flex;align-items:center;gap:18px;transition:all .2s ease;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.subject-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar-color)}
.subject-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:transparent}
.subject-icon{width:54px;height:54px;border-radius:14px;background:var(--bg-light);color:var(--bar-color);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;font-weight:700}
.subject-body{flex:1;min-width:0}
.subject-num{font-size:11px;font-weight:600;color:var(--bar-color);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.subject-name{font-size:16px;font-weight:700;color:var(--text-main);letter-spacing:-.02em;margin-bottom:5px;line-height:1.35}
.subject-desc{font-size:12px;color:var(--text-sub);line-height:1.55}
.subject-meta{font-size:11px;color:var(--text-muted);margin-top:8px;display:flex;gap:8px;align-items:center}
.subject-meta .dot{width:3px;height:3px;background:var(--text-muted);border-radius:50%}
.subject-arrow{font-size:18px;color:var(--text-muted);transition:transform .2s,color .2s;flex-shrink:0}
.subject-card:hover .subject-arrow{transform:translate(3px,-3px);color:var(--bar-color)}
.s1{--bar-color:var(--sub1);--bg-light:var(--sub1-l)}
.s2{--bar-color:var(--sub2);--bg-light:var(--sub2-l)}
.s3{--bar-color:var(--sub3);--bg-light:var(--sub3-l)}
.s4{--bar-color:var(--sub4);--bg-light:var(--sub4-l)}
.s5{--bar-color:var(--sub5);--bg-light:var(--sub5-l)}
.s6{--bar-color:var(--sub6);--bg-light:var(--sub6-l)}
.s7{--bar-color:var(--sub7);--bg-light:var(--sub7-l)}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem 1.4rem;display:flex;gap:12px;align-items:flex-start;margin-top:2rem;animation:fadeUp .6s .25s ease both}
.notice-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.notice-text{font-size:12px;color:var(--text-sub);line-height:1.65}
.notice-text strong{color:var(--text-main);font-weight:600}
.pdf-btn-wrap{display:flex;justify-content:center;margin-bottom:2rem;animation:fadeUp .5s .08s ease both}
.pdf-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:50px;background:linear-gradient(135deg,#B83A3A 0%,#952E2E 100%);color:#fff;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:-.02em;box-shadow:0 4px 18px rgba(184,58,58,.38);transition:all .22s ease;white-space:nowrap}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(184,58,58,.50);filter:brightness(1.07)}
.pdf-btn:active{transform:translateY(0);box-shadow:0 3px 10px rgba(184,58,58,.30)}
.pdf-btn-icon{font-size:18px;line-height:1;flex-shrink:0}
.footer{text-align:center;font-size:12px;color:var(--text-muted);padding:1.5rem;border-top:1px solid var(--border);width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .site-header{padding:1.2rem 1rem}
  .subject-card{padding:1.2rem 1.3rem;gap:14px}
  .subject-icon{width:46px;height:46px;font-size:21px}
  .subject-name{font-size:15px}
}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">
    <div class="logo-icon">韓</div>
    <div class="logo-text">한능검 <span>심화</span> 기출문제</div>
  </a>
  <a class="back-btn" href="index.html">← 메인으로</a>
</header>

<main class="main">
  <div class="page-title">
    <h1>단원별 <em>기출문제</em> 풀기</h1>
    <p id="page-desc">풀고 싶은 단원을 선택하면 68~78회 전 회차의<br>해당 단원 문제가 한 번에 출제됩니다.</p>
  </div>

  <div class="pdf-btn-wrap">
    <a class="pdf-btn"
       href="https://dreaming-ryan.com/home?product=%ED%95%9C%EB%8A%A5%EA%B2%80%20%EC%9A%94%EC%95%BD%EB%85%B8%ED%8A%B8%20PDF"
       target="_blank"
       rel="noopener noreferrer">
      <span class="pdf-btn-icon">📙</span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>한능검 요약노트 PDF</span>
        <span style="font-size:13px;font-weight:500;opacity:.9">무료 샘플 받기</span>
      </span>
    </a>
  </div>

  <div class="subject-grid" id="subject-grid">
    <!-- 동적으로 생성됨 -->
  </div>

  <div class="notice">
    <span class="notice-icon">🎯</span>
    <p class="notice-text" id="notice-text">
      <strong>단원별 집중 학습</strong> &nbsp;취약한 단원 한 가지를 골라 68~78회 11년치를 한 번에 풀어보면
      반복 출제 패턴과 핵심 개념이 자연스럽게 정리됩니다.
    </p>
  </div>
</main>

<footer class="footer" id="footer-text">한국사능력검정시험(심화) 기출문제 학습 자료 · 68~78회</footer>

<script src="history_stats.js"></script>
<script>
HistoryStats.load(stats => {
  const fmt = HistoryStats.fmtComma;
  const roundCount = stats.totalRounds;

  // 1. 단원 카드 동적 생성
  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';
  Object.keys(stats.subjectNames)
    .map(n => parseInt(n, 10))
    .sort((a, b) => a - b)
    .forEach(n => {
      const meta = stats.subjectMeta[n] || { icon: '📖', desc: '' };
      const cnt = stats.subjectCounts[n] || 0;
      const a = document.createElement('a');
      a.className = `subject-card s${n}`;
      a.href = `history_quiz.html?subject=${n}`;
      a.innerHTML = `
        <div class="subject-icon">${meta.icon}</div>
        <div class="subject-body">
          <div class="subject-num">${n}단원</div>
          <div class="subject-name">${stats.subjectNames[n]}</div>
          <div class="subject-desc">${meta.desc}</div>
          <div class="subject-meta">
            <span>${fmt(cnt)}문항</span>
            <span class="dot"></span>
            <span>${stats.roundRangeText} 전 회차</span>
          </div>
        </div>
        <div class="subject-arrow">↗</div>
      `;
      grid.appendChild(a);
    });

  // 2. 페이지 안내 문구
  const pageDesc = document.getElementById('page-desc');
  if (pageDesc) {
    pageDesc.innerHTML =
      `풀고 싶은 단원을 선택하면 ${stats.roundRangeText} 전 회차의<br>` +
      `해당 단원 문제가 한 번에 출제됩니다.`;
  }

  // 3. 하단 안내 박스
  const noticeText = document.getElementById('notice-text');
  if (noticeText) {
    noticeText.innerHTML =
      `<strong>단원별 집중 학습</strong> &nbsp;취약한 단원 한 가지를 골라 ${stats.roundRangeText} ${roundCount}회차를 한 번에 풀어보면 ` +
      `반복 출제 패턴과 핵심 개념이 자연스럽게 정리됩니다.`;
  }

  // 4. 푸터
  const footerText = document.getElementById('footer-text');
  if (footerText) {
    footerText.textContent = `한국사능력검정시험(심화) 기출문제 학습 자료 · ${stats.roundRangeText}`;
  }
});
</script>
</body>
</html>
