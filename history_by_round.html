<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B83A3A'/><text x='50' y='68' text-anchor='middle' font-size='52' font-family='serif' font-weight='700' fill='%23fff'>韓</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사능력검정시험 심화 — 회차별 기출문제</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAF7F2;--surface:#FFFFFF;--border:#E5DFD3;
  --text-main:#1F1A14;--text-sub:#5A5046;--text-muted:#9A8E7C;
  --point:#B83A3A;--point-l:#FBE9E9;--point-d:#952E2E;
  --r-lg:20px;--r-md:14px;
  --sh-sm:0 1px 4px rgba(28,26,22,.06);--sh-lg:0 12px 40px rgba(28,26,22,.12)
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.site-header{width:100%;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;background:var(--point);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-family:'Noto Serif KR',serif;font-weight:700}
.logo-text{font-size:15px;font-weight:600;color:var(--text-main);letter-spacing:-.02em}
.logo-text span{color:var(--point)}
.back-btn{font-size:13px;color:var(--text-sub);text-decoration:none;padding:6px 14px;border-radius:20px;background:var(--bg);border:1px solid var(--border);transition:all .15s}
.back-btn:hover{background:var(--point-l);color:var(--point);border-color:var(--point-l)}
.main{width:100%;max-width:680px;padding:2.5rem 1.5rem 6rem;flex:1}
.page-title{text-align:center;margin-bottom:2rem;animation:fadeUp .5s ease both}
.page-title h1{font-size:clamp(22px,4vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.4;margin-bottom:.6rem}
.page-title h1 em{color:var(--point);font-style:normal}
.page-title p{font-size:14px;color:var(--text-sub);line-height:1.65}
.round-section{margin-bottom:2rem;animation:fadeUp .6s .1s ease both}
.round-label{font-size:14px;font-weight:700;color:var(--point);margin-bottom:.9rem;display:flex;align-items:center;gap:8px}
.round-label::before{content:'';width:4px;height:14px;background:var(--point);border-radius:2px}
.round-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.round-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem .9rem;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .18s ease;box-shadow:var(--sh-sm)}
.round-card:hover{border-color:var(--point);transform:translateY(-2px);box-shadow:var(--sh-lg);background:var(--point-l)}
.round-num{font-size:22px;font-weight:700;color:var(--text-main);letter-spacing:-.03em;line-height:1;font-family:'Noto Serif KR',serif}
.round-card:hover .round-num{color:var(--point)}
.round-label-sm{font-size:11px;color:var(--text-muted);font-weight:500}
.round-count{font-size:10px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:10px;margin-top:2px}
.round-card:hover .round-count{background:#fff}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.1rem 1.4rem;display:flex;gap:12px;align-items:flex-start;margin-top:2rem;animation:fadeUp .6s .25s ease both}
.notice-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.notice-text{font-size:12px;color:var(--text-sub);line-height:1.65}
.notice-text strong{color:var(--text-main);font-weight:600}
.pdf-btn-wrap{display:flex;justify-content:center;margin-bottom:2rem;animation:fadeUp .5s .08s ease both}
.pdf-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border-radius:50px;background:linear-gradient(135deg,#B83A3A 0%,#952E2E 100%);color:#fff;font-size:15px;font-weight:700;text-decoration:none;letter-spacing:-.02em;box-shadow:0 4px 18px rgba(184,58,58,.38);transition:all .22s ease;white-space:nowrap}
.pdf-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(184,58,58,.50);filter:brightness(1.07)}
.pdf-btn:active{transform:translateY(0);box-shadow:0 3px 10px rgba(184,58,58,.30)}
.pdf-btn-icon{font-size:18px;line-height:1;flex-shrink:0}
.footer{text-align:center;font-size:12px;color:var(--text-muted);padding:1.5rem;border-top:1px solid var(--border);width:100%}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){
  .round-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .round-num{font-size:19px}
  .site-header{padding:1.2rem 1rem}
}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">
    <div class="logo-icon">韓</div>
    <div class="logo-text">한능검 <span>심화</span> 기출문제</div>
  </a>
  <a class="back-btn" href="index.html">← 메인으로</a>
</header>

<main class="main">
  <div class="page-title">
    <h1>회차별 <em>기출문제</em> 풀기</h1>
    <p id="page-desc">풀고 싶은 회차를 선택하면 해당 회차 50문항이<br>실제 시험 순서대로 출제됩니다.</p>
  </div>

  <div class="pdf-btn-wrap">
    <a class="pdf-btn"
       href="https://dreaming-ryan.com/home?product=%ED%95%9C%EB%8A%A5%EA%B2%80%20%EC%9A%94%EC%95%BD%EB%85%B8%ED%8A%B8%20PDF"
       target="_blank"
       rel="noopener noreferrer">
      <span class="pdf-btn-icon">📙</span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>한능검 요약노트 PDF</span>
        <span style="font-size:13px;font-weight:500;opacity:.9">무료 샘플 받기</span>
      </span>
    </a>
  </div>

  <div id="rounds-container"></div>

  <div class="notice">
    <span class="notice-icon">📝</span>
    <p class="notice-text" id="notice-text">
      <strong>회차별 학습</strong> &nbsp;각 회차는 50문항으로 구성되어 있어요.
      실제 시험과 동일한 형태로 풀어보면서 시간 분배 감각도 함께 익혀보세요.
    </p>
  </div>
</main>

<footer class="footer" id="footer-text">한국사능력검정시험(심화) 기출문제 학습 자료 · 68~78회</footer>

<script src="history_stats.js"></script>
<script>
HistoryStats.load(stats => {
  const fmt = HistoryStats.fmtComma;

  // 회차 → 시행 연도 매핑 (한국사능력검정시험 공식 시행 일정 기준)
  // 2023: 63~68회 / 2024: 69~72회 / 2025: 73~76회 / 2026: 77~
  // 알 수 없는 회차는 추정 규칙 사용 (회차당 약 4회/년, 77회=2026년 기준 역산)
  const ROUND_TO_YEAR = {
    68: 2023,
    69: 2024, 70: 2024, 71: 2024, 72: 2024,
    73: 2025, 74: 2025, 75: 2025, 76: 2025,
    77: 2026, 78: 2026, 79: 2026, 80: 2026, 81: 2026
  };
  function roundToYear(r) {
    if (ROUND_TO_YEAR[r]) return ROUND_TO_YEAR[r];
    // fallback: 77회=2026 기준으로 4회차/년 추정
    return 2026 - Math.ceil((77 - r) / 4);
  }

  // 회차들을 연도별로 그룹화
  const groups = {};
  stats.rounds.forEach(r => {
    const year = roundToYear(Number(r));
    if (!groups[year]) groups[year] = [];
    groups[year].push(Number(r));
  });
  // 각 그룹 내 회차 오름차순 정렬, 그룹 키(연도)는 내림차순
  Object.keys(groups).forEach(y => groups[y].sort((a, b) => a - b));
  const yearKeys = Object.keys(groups).sort((a, b) => Number(b) - Number(a));

  // 회차 카드 그리드 렌더링
  const container = document.getElementById('rounds-container');
  container.innerHTML = '';
  yearKeys.forEach(year => {
    const section = document.createElement('div');
    section.className = 'round-section';

    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = `${year}년 시행`;
    section.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'round-grid';

    groups[year].forEach(r => {
      const a = document.createElement('a');
      a.className = 'round-card';
      a.href = `history_quiz.html?round=${r}`;

      const num = document.createElement('div');
      num.className = 'round-num';
      num.textContent = `제${r}회`;
      a.appendChild(num);

      const lbl = document.createElement('div');
      lbl.className = 'round-label-sm';
      lbl.textContent = '한능검 심화';
      a.appendChild(lbl);

      const cntVal = stats.roundCounts[r] || 0;
      const cnt = document.createElement('div');
      cnt.className = 'round-count';
      cnt.textContent = `${fmt(cntVal)}문항`;
      a.appendChild(cnt);

      grid.appendChild(a);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  // 회차당 평균 문항 수
  const avgPerRound = stats.totalRounds
    ? Math.round(stats.totalQ / stats.totalRounds)
    : 0;

  // 페이지 안내 문구
  const pageDesc = document.getElementById('page-desc');
  if (pageDesc) {
    pageDesc.innerHTML =
      `풀고 싶은 회차를 선택하면 해당 회차 ${fmt(avgPerRound)}문항이<br>` +
      `실제 시험 순서대로 출제됩니다.`;
  }

  // 하단 안내 박스
  const noticeText = document.getElementById('notice-text');
  if (noticeText) {
    noticeText.innerHTML =
      `<strong>회차별 학습</strong> &nbsp;각 회차는 ${fmt(avgPerRound)}문항으로 구성되어 있어요. ` +
      `실제 시험과 동일한 형태로 풀어보면서 시간 분배 감각도 함께 익혀보세요.`;
  }

  // 푸터
  const footerText = document.getElementById('footer-text');
  if (footerText) {
    footerText.textContent = `한국사능력검정시험(심화) 기출문제 학습 자료 · ${stats.roundRangeText}`;
  }
});
</script>
</body>
</html>
